name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - run: go test -p=1 -count=1 ./...

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - run: go vet ./...
      - run: go build ./...

  vulnerability:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  fuzz:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - run: go test -run '^$' -fuzz=FuzzStaticValueEval -fuzztime=30s ./internal/compiler/source/
      - run: go test -run '^$' -fuzz=FuzzCompiledCallbackOptimizationSemantics -fuzztime=30s ./internal/compiler/
